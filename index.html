    let currentSection = "Food"; // "Food" or "Drinks"
    let currentCategory = "All";
    let searchQuery = "";

    function formatMoney(amount) {
      if (amount <= 0) return "Market Price";
      return "₦" + amount.toLocaleString('en-NG', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
    }

    window.setSection = function(section) {
      currentSection = section;
      currentCategory = "All";
      
      const btnFood = document.getElementById("btnFood");
      const btnDrinks = document.getElementById("btnDrinks");

      if (section === "Food") {
        btnFood.className = "flex-1 py-2 text-xs font-bold rounded-lg transition-all bg-emerald-800 text-white shadow-sm";
        btnDrinks.className = "flex-1 py-2 text-xs font-bold rounded-lg transition-all text-gray-600 hover:text-gray-900";
      } else {
        btnDrinks.className = "flex-1 py-2 text-xs font-bold rounded-lg transition-all bg-emerald-800 text-white shadow-sm";
        btnFood.className = "flex-1 py-2 text-xs font-bold rounded-lg transition-all text-gray-600 hover:text-gray-900";
      }

      renderCategories();
      renderMenu();
    };

    function renderCategories() {
      const container = document.getElementById("categoryContainer");
      const sectionItems = rawData.filter(item => item.section === currentSection);
      const uniqueCategories = ["All", ...new Set(sectionItems.map(i => i.category))];

      container.innerHTML = uniqueCategories.map(cat => {
        const isActive = cat === currentCategory;
        return `
          <button 
            onclick="setCategory('${cat.replace(/'/g, "\\\'")}')"
            class="px-3.5 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap transition-all ${
              isActive 
                ? 'bg-emerald-800 text-white shadow-sm' 
                : 'bg-gray-100 text-gray-600 hover:bg-gray-200'
            }"
          >
            ${cat}
          </button>
        `;
      }).join('');
    }

    window.setCategory = function(cat) {
      currentCategory = cat;
      renderCategories();
      renderMenu();
    };

    function renderMenu() {
      const menuList = document.getElementById("menuList");
      const emptyState = document.getElementById("emptyState");
      const categoryTitle = document.getElementById("categoryTitle");
      const itemCount = document.getElementById("itemCount");

      const filtered = rawData.filter(item => {
        const matchesSection = item.section === currentSection;
        const matchesCategory = currentCategory === "All" || item.category === currentCategory;
        const query = searchQuery.toLowerCase().trim();
        const matchesSearch = query === "" || 
                              item.name.toLowerCase().includes(query) || 
                              item.category.toLowerCase().includes(query);
        return matchesSection && matchesCategory && matchesSearch;
      });

      categoryTitle.textContent = currentCategory === "All" ? `All ${currentSection}` : currentCategory;
      itemCount.textContent = `${filtered.length} items`;

      if (filtered.length === 0) {
        menuList.innerHTML = "";
        emptyState.classList.remove("hidden");
        return;
      }

      emptyState.classList.add("hidden");
      menuList.innerHTML = filtered.map(item => `
        <div class="bg-white rounded-xl p-3.5 border border-gray-100 shadow-sm flex justify-between items-center hover:border-gray-200 transition">
          <div class="pr-3">
            <h3 class="text-sm font-semibold text-gray-900">${item.name}</h3>
            <span class="text-[10px] font-medium text-emerald-800 bg-emerald-50 px-2 py-0.5 rounded-md inline-block mt-1">
              ${item.category}
            </span>
          </div>
          <div class="text-right whitespace-nowrap">
            <span class="text-sm font-bold text-gray-900">${formatMoney(item.price)}</span>
          </div>
        </div>
      `).join('');
    }

    document.getElementById("searchInput").addEventListener("input", (e) => {
      searchQuery = e.target.value;
      renderMenu();
    });

    // Initialize
    renderCategories();
    renderMenu();
  </script>
